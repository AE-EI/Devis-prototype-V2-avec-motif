  <!-- Cache-busting : ajoute ?v=timestamp une seule fois par onglet -->
  <script>
  (function(){
    try{
      var url = new URL(location.href);
      if (url.searchParams.has('v')) return;
      var onceKey = 'cb_once_' + location.pathname;
      if (sessionStorage.getItem(onceKey)) return;
      url.searchParams.set('v', Date.now());
      sessionStorage.setItem(onceKey, '1');
      location.replace(url.toString());
    }catch(e){}
  })();
  </script>

  <!-- =============================
     CHAPITRE 2 : ÉTAT & HELPERS
     Index :

<script>
// §2.1 • Gestion erreurs globales
window.addEventListener('error', function (e) {
  var el = document.getElementById('app');
  if (el) {
    el.innerHTML =
      '<div class="card"><h2>Erreur JS</h2><pre>'
      + (e.message || 'Erreur inconnue')
      + '\n' + (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0)
      + '</pre>'
      + '<button class="btn primary" onclick="(typeof pageMain===\'function\')?pageMain():location.reload()">⬅️ Retour à l’accueil</button>'
      + '</div>';
  }
});

// §2.1b • Wrappers sûrs pour alert()/confirm() (indisponibles dans certains contextes PWA/standalone)
// En cas d’échec du dialogue natif, on retombe sur un toast (alert) ou une modale inline (confirm)
// au lieu de laisser l’exception remonter et casser toute la page (cf. §2.1).
(function(){
  var nativeAlert = window.alert;
  var nativeConfirm = window.confirm;

  function showToast(msg){
    try{
      var t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);'
        + 'background:#111;color:#fff;padding:10px 16px;border-radius:8px;z-index:10000;'
        + 'max-width:90vw;box-shadow:0 4px 12px rgba(0,0,0,.3);font-size:14px;';
      document.body.appendChild(t);
      setTimeout(function(){ t.remove(); }, 2500);
    }catch(e){}
  }

  window.alert = function(msg){
    try{ nativeAlert(msg); }
    catch(e){ showToast(String(msg)); }
  };

  window.confirm = function(msg){
    try{ return nativeConfirm(msg); }
    catch(e){
      // Dialogue natif indisponible : on ne bloque pas l’action (mieux vaut
      // laisser l’utilisateur continuer que figer l’app sans confirmation possible).
      showToast(String(msg));
      return true;
    }
  };
})();

// §2.2 • État global & contexte courant
var devis = {}; // contiendra aussi __id, __name, __tabCounter
var ctx   = { piece:null, category:null, intervention:null, pose:null, designation:null };

// §2.3 • Identifiants & helpers DOM/UI
function genId(){ return 'dv_' + Math.random().toString(36).slice(2) + Date.now().toString(36); }
function ensureId(){ if(!devis.__id) devis.__id = genId(); }
function $app(){ return document.getElementById('app'); }
function b(label, fn, cls){
  cls = cls || 'btn';
  return '<button class="'+cls+'" onclick=\''+fn+'\'>'+label+'</button>';
}
function euro(n){ return (+(n||0)).toFixed(2) + ' €'; }
function view(html, noFooter){
  if(!noFooter){
    html += '<div class="row" style="margin-top:16px; gap:12px;">'
          + b('⬅️ Accueil','confirmBackHome()','btn back')
          + b('💾 Sauvegarder devis','saveCurrentDevis()','btn primary')
          + '</div>';
  }
  $app().innerHTML = html;
}
function confirmBackHome(){
  var hasData = Object.keys(devis)
    .filter(function(k){ return k.indexOf('__') !== 0; })
    .some(function(k){
      var s = devis[k]||{};
      return (s.items && s.items.length>0) || (s.note && s.note.trim().length>0);
    });

  if(!hasData || confirm('Revenir au menu principal ?\n⚠️ Les modifications non sauvegardées seront perdues.')){
    if (typeof pageMain === 'function') pageMain();
    else $app().innerHTML = '<div class="card"><h2>Accueil</h2><p class="muted">Le chapitre Menu (4) n\'est pas encore chargé.</p></div>';
  }
}

// §2.4 • Libellés de pièces (build/format)
function buildPieceLabel(base, qualif, etage){
  var lbl = base || '';
  if(qualif && qualif.trim()) lbl += ' ('+qualif.trim()+')';
  if(etage && etage.trim())   lbl += ' — '+etage.trim();
  return lbl;
}
function nextFreeKey(label){
  if(!devis[label]) return label;
  var n=2; while(devis[label+' ('+n+')']) n++;
  return label+' ('+n+')';
}
function createOrGetPiece(base, qualif, etage){
  var wanted = buildPieceLabel(base,qualif,etage);
  var key    = nextFreeKey(wanted);
  if(!devis[key]) devis[key] = { __base:base, qualificatif:qualif||'', etage:etage||'', items:[], note:'' };
  saveLocal();
  return key;
}
function formatPieceLabel(key){
  var s = devis[key]; if(!s) return key;
  var base = s.__base || key;
  return buildPieceLabel(base, s.qualificatif, s.etage);
}

// §2.5 • Persistance locale (save/load)
function ensureSection(key){
  if(!devis[key]) devis[key] = { items:[], note:'', qualificatif:'', etage:'' };
}
function saveLocal(){
  try { localStorage.setItem('devis', JSON.stringify(devis)); } catch(e){}
}
function loadLocal(){
  try { devis = JSON.parse(localStorage.getItem('devis') || '{}') || {}; }
  catch(e){ devis = {}; }
  ensureId();
}
</script>

  }
};

// Coefficients de POSE (appliqués à Prises, Éclairage et CS)
var COEFF_POSE = {

  'Encastré maçonnerie': 1.50,
  'Semi-encastré': 1.40,
  'Sur-mesure': 1.60,
  'Saillie avec moulure': 1.35,
  'Sous tube IRL': 1.35
};

// Coefficients de SECTION pour CS :
// 0,75 et 1,5 → 1.00 ; 2,5 → +10% ; 6 → +20%
var COEFF_SECTIONS_CS = {
  '0,75 mm²': 1.00,
  '1,5 mm²': 1.00,
  '2,5 mm²': 1.20,
  '6 mm²': 1.40
};

/* ============ Tableau & distribution (inchangé) ============ */
var TARIFS_TABLEAU = {
  pose_base_13: { 1:70, 2:90, 3:110, 4:130 },
  coef: {
    modules: { 13:1.00, 18:1.30, 24:1.50 },
    pose: { 'Saillie':1.00, 'Encastré':1.70 },
    intervention: { 'Création':1.00, 'Avec dépose de l’existant':1.30 }
  },
  disjoncteurs: { 2:32, 10:25, 16:25, 20:25, 32:32, 40:45 },

    'Horloge mécanique + contacteur heures creuses + Disjoncteur 2A':140
  }
};

/* ============ Helpers PRIX communs ============ */

// Arrondi au 5 supérieur (toujours vers le haut)
function roundUp5(x){
  x = +x || 0;
  return Math.ceil(x / 5) * 5;
}

// Renvoie le PU avec pose/section + arrondi au 5 supérieur
// category : 'Prises' | 'Éclairage/Luminaires' | 'Éclairage/Commandes' | 'Circuit spécialisé'
function computePU(category, designation, intervention, pose, section){
  var base = 0;

  if(category === 'Prises'){
    base = (TARIFS_BASE.prises[intervention] || 0);

  } else if(category === 'Éclairage/Luminaires' || category === 'Éclairage/Commandes'){
    base = (TARIFS_BASE.eclairage[designation] && TARIFS_BASE.eclairage[designation][intervention]) || 0;

  } else if(category === 'Circuit spécialisé'){
    base = (TARIFS_BASE.circuit_specialise_base[intervention] || 0);
    // Coeff section
    var cSec = COEFF_SECTIONS_CS[section] || 1.00;
    base = base * cSec;
  }

  // Coeff pose
  var cPose = COEFF_POSE[pose] || 1.00;
  var total = base * cPose;

  // Arrondi 5 supérieur
  return roundUp5(total);
}

// Back-compat : utilisé ailleurs (estimatif…)
function getPrix(designation, intervention){
  // garde une compatibilité minimale si appelé sans contexte
  // (ex : prévisualisation ancienne). On renvoie juste la base eclairage.
  var e = TARIFS_BASE.eclairage[designation];
  return e ? (e[intervention] || 0) : 0;
}

<!-- =============================
     CHAPITRE 4 : MENU PRINCIPAL & SAUVEGARDES (robuste)
     Index :

       §4.1 • Accueil principal (avec bouton Paramétrage)

<script>
// === §4.0 • Clés & helpers de stockage =========================
const STORE_KEYS = {
  current: 'devis',
  saved:   'savedDevisList',
  backup:  'savedDevisListBackup'
};
function readJSON(key, fallback){
  try { return JSON.parse(localStorage.getItem(key) || 'null') ?? fallback; }
  catch(e){ return fallback; }
}
function writeJSON(key, value){
  try { localStorage.setItem(key, JSON.stringify(value)); } catch(e){}
}

// Petit helper HTML safe (listes)
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Bouton Paramétrage (sécurisé si le Chap.8 n'est pas chargé)
function openTarifs(){
  if (typeof pageTarifsAccueil === 'function') pageTarifsAccueil();
  else alert('Le chapitre Paramétrage (8) n’est pas encore chargé.');
}

// === §4.1 • Accueil principal =================================
function pageMain(){
  // view() & b() sont définis dans les chapitres communs (2.x)
  view(
    '<div class="card">'
      + '<h2>Menu principal</h2>'
      + '<div class="row">'
        + b('➕ Nouveau devis','actionNouveauDevis()','btn primary')
        + b('📂 Mes devis sauvegardés','pageSavedDevis()','btn')
        + b('⚙️ Paramétrage des tarifs','openTarifs()','btn')
      + '</div>'
    + '</div>'
  , true);
}

// === §4.2 • Nouveau devis / Ouverture / Suppression ===========
function actionNouveauDevis(){
  // genId(), saveLocal(), pageHome() → chapitres 2 & 5
  devis = { __id: genId(), __name: '' };
  saveLocal();
  pageHome();
}

function pageSavedDevis(){
  var saved = getSavedList();

  if(!saved.length){
    return view(
      '<div class="card">'
        + b('⬅️ Retour','pageMain()','btn back')
        + '<h2>Mes devis sauvegardés</h2>'
        + '<p class="muted">Aucun devis sauvegardé.</p>'
        + '<div class="row" style="margin-top:10px;">'
          + b('⬆️ Importer…','importSavedDevisUI()','btn')
        + '</div>'
      + '</div>'
    , true);
  }

  var list = saved.map(function(d,i){
    var title = escapeHtml(d.name || ('Devis '+(i+1)));
    var date  = escapeHtml(d.date || '');
    return '<div class="pill" style="width:100%; justify-content:space-between;">'
         +   '<span><strong>'+title+'</strong> <small class="muted">'+date+'</small></span>'
         +   '<span>'
         +     b('Ouvrir','loadDevis('+i+')','btn')
         +     b('Supprimer','deleteDevis('+i+')','btn')
         +   '</span>'
         + '</div>';
  }).join('');

  view(
    '<div class="card">'
      + b('⬅️ Retour','pageMain()','btn back')
      + '<h2>Mes devis sauvegardés</h2>'
      + '<div class="list">'+list+'</div>'
      + '<div class="row" style="margin-top:12px;">'
        + b('💾 Exporter tout (.json)','exportSavedDevis()','btn')
        + b('⬆️ Importer…','importSavedDevisUI()','btn')
      + '</div>'
    + '</div>'
  , true);
}

function loadDevis(idx){
  var saved = getSavedList();
  if(!saved[idx]) return pageSavedDevis();
  devis = saved[idx].data || {};
  ensureId();
  saveLocal();
  pageHome();
}

function deleteDevis(idx){
  if(!confirm('Supprimer ce devis sauvegardé ?')) return;
  var saved = getSavedList();
  saved.splice(idx,1);
  setSavedList(saved);
  makeSavedBackup(saved);
  pageSavedDevis();
}

// === §4.3 • Sauvegarde complète (+ backup automatique) ========
function saveCurrentDevis(){
  ensureId();
  var saved = getSavedList();

  // Cherche par __id (mise à jour si trouvé)
  var i = saved.findIndex(function(d){ return d.data && d.data.__id === devis.__id; });

  // Détermine/valide le nom
  var name = (devis.__name||'').trim();
  if(i < 0 && !name){
    showNamePromptModal('Nom du devis :', function(chosenName){
      if(!chosenName){ alert('Sauvegarde annulée.'); return; }
      _finishSaveCurrentDevis(chosenName);
    });
    return;
  }
  _finishSaveCurrentDevis(name);
}
function _finishSaveCurrentDevis(name){
  var saved = getSavedList();
  var i = saved.findIndex(function(d){ return d.data && d.data.__id === devis.__id; });
  devis.__name = name || (saved[i]?.name) || ('Devis '+new Date().toLocaleDateString());

  var record = { name: devis.__name, date: new Date().toLocaleString(), data: devis };

  if(i >= 0){
    saved[i] = record;
  } else {
    // Dédoublonnage par nom (évite 2 entrées strictement homonymes)
    var j = saved.findIndex(function(d){ return (d.name||'').toLowerCase() === devis.__name.toLowerCase(); });
    if(j >= 0){
      if(!confirm('Un devis « '+devis.__name+' » existe déjà. L\'écraser ?')) return;
      saved[j] = record;
    } else {
      saved.push(record);
    }
  }

  setSavedList(saved);
  makeSavedBackup(saved);
  alert('✅ Devis sauvegardé.');
}

/** Petite modale inline (remplace prompt(), indisponible en PWA standalone iOS) */
function showNamePromptModal(label, callback){
  showInlinePrompt(label, '', callback);
}
function showInlinePrompt(label, defaultValue, callback){
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;';
  overlay.innerHTML = '<div class="card" style="max-width:400px;width:100%;background:#fff;">'
    + '<h3 style="margin-top:0;">'+label+'</h3>'
    + '<input id="modal-inline-prompt" />'
    + '<div class="row" style="margin-top:12px; gap:8px;">'
    + '<button class="btn primary" id="modal-inline-ok">Valider</button>'
    + '<button class="btn" id="modal-inline-cancel">Annuler</button>'
    + '</div></div>';
  document.body.appendChild(overlay);
  var input = overlay.querySelector('#modal-inline-prompt');
  input.value = (defaultValue!=null ? String(defaultValue) : '');
  input.focus();
  input.select();
  function cleanup(){ document.body.removeChild(overlay); }
  overlay.querySelector('#modal-inline-ok').onclick = function(){
    var v = input.value;
    cleanup();
    callback(v);
  };
  overlay.querySelector('#modal-inline-cancel').onclick = function(){
    cleanup();
    callback(null);
  };
  overlay.addEventListener('click', function(e){ if(e.target===overlay){ cleanup(); callback(null); } });
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ overlay.querySelector('#modal-inline-ok').click(); }
  });
}

// === §4.4 • Export / Import ===================================
function exportSavedDevis(){
  var saved = getSavedList();
  var payload = {
    _kind: 'MiniDevisSaved',
    version: 1,
    origin: location.origin,
    exported_at: new Date().toISOString(),
    items: saved
  };
  var blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json;charset=utf-8'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = 'minidevis_sauvegardes_'+(new Date().toISOString().slice(0,19).replace(/[:T]/g,'-'))+'.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importSavedDevisUI(){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = function(){
    var f = input.files && input.files[0];
    if(!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      try{
        var json = JSON.parse(rd.result||'null');
        var items = Array.isArray(json?.items) ? json.items : (Array.isArray(json)? json : null);
        if(!items){ alert('Fichier non reconnu.'); return; }
        var merged = mergeSavedLists(getSavedList(), items);
        setSavedList(merged);
        makeSavedBackup(merged);
        alert('✅ Import terminé : '+items.length+' enregistrement(s) lu(s).');
        pageSavedDevis();
      }catch(e){
        alert('Erreur d’import : '+e.message);
      }
    };
    rd.readAsText(f, 'utf-8');
  };
  input.click();
}

// === §4.5 • Routines internes (backup, merge, recovery) =======
function getSavedList(){ return readJSON(STORE_KEYS.saved, []); }
function setSavedList(list){ writeJSON(STORE_KEYS.saved, Array.isArray(list)?list:[]); }

// Sauvegarde miroir (pour récupération si effacement accidentel)
function makeSavedBackup(list){
  writeJSON(STORE_KEYS.backup, {
    saved: Array.isArray(list)?list:[],
    host: location.host,
    t: Date.now()
  });
}

// Appeler recoverSavedIfEmpty() au boot (cf. init() du Chap. 10)
function recoverSavedIfEmpty(){
  var saved = getSavedList();
  if(saved && saved.length) return; // rien à faire
  var backup = readJSON(STORE_KEYS.backup, null);
  if(backup && Array.isArray(backup.saved) && backup.saved.length){
    if(confirm('Aucune sauvegarde active trouvée, mais une copie de secours est disponible. Restaurer ?')){
      setSavedList(backup.saved);
    }
  }
}

// Fusion non destructive par __id (priorité au plus récent via date)
function mergeSavedLists(existing, incoming){
  var map = new Map();
  function put(rec){
    var id = rec?.data?.__id || rec?.__id || genId();
    var cur = map.get(id);
    var recDate = new Date(rec?.date||0).getTime() || 0;
    var curDate = new Date(cur?.date||0).getTime() || 0;
    if(!cur || recDate >= curDate){
      map.set(id, {
        name: rec?.name || rec?.data?.__name || 'Devis',
        date: rec?.date || new Date().toLocaleString(),
        data: rec?.data || rec
      });
    }
  }
  (existing||[]).forEach(put);
  (incoming||[]).forEach(put);
  return Array.from(map.values());
}
</script>

function goPiece(key){

    .map(c=> b(c,'goCategory('+JSON.stringify(c)+')','btn'))
    .join('');

  var s = devis[key];
  var lignes = (s.items||[]).length
    ? '<ul>'+s.items.map(function(it,i){
        var total = (+it.prixU||0) * (+it.qty||0);
        var poseTxt = (it.intervention==="Création" && it.pose) ? ' — '+String(it.pose).toLowerCase() : '';
        var unitTxt = it.unit || 'u';
        var left = it.intervention ? (it.intervention+' — ') : '';

            + left + it.designation + poseTxt + ' — '
            + '<input id="edit-qty-'+i+'" type="number" inputmode="decimal" min="0.01" step="any" value="'+it.qty+'" style="width:80px;display:inline-block;" /> '+unitTxt+' '

            + b('Annuler','cancelLineEdit('+JSON.stringify(key)+')','btn')
          +'</li>';
        }
        return '<li>'
          + left + it.designation + poseTxt
          +' ('+it.qty+' '+unitTxt+' × '+euro(it.prixU)+' = '+euro(total)+') '
          + b('Modifier','editLine('+JSON.stringify(key)+','+i+')','btn')

function delLine(key, idx){
  (devis[key].items||[]).splice(idx,1); saveLocal(); goPiece(key);
}
function editLine(key, idx){

}
function cancelLineEdit(key){
  window.__editingLine = null;
  goPiece(key);
}
function saveLineEdit(key, idx){
  var it = (devis[key].items||[])[idx];
  if(!it) return;
  var input = document.getElementById('edit-qty-'+idx);

  var n = parseFloat(String(val).replace(',','.'));
  if(isNaN(n) || n<=0){ alert('Quantité invalide.'); return; }

  goPiece(key);

function removePiece(key){

<!-- 5.4 — Saisie “one-shot” (masquage dynamique pose/section hors Création) -->
<script>
function pageOneShotSelection(){
  var cat = ctx.category;

  // 1) Interventions par catégorie
  var invs = [];
  if(cat==='Prises' || cat==='Circuit spécialisé'){
    invs = [
      'Création',
      'Remplacement appareillage',
      'Recâblage avec remplacement appareillage',
      'Recâblage sans remplacement appareillage'
    ];
  } else if(cat==='Éclairage/Luminaires'){
    invs = [
      'Création',
      'Remplacement luminaire',
      'Recâblage avec remplacement luminaire',
      'Recâblage sans remplacement luminaire'
    ];
  } else if(cat==='Éclairage/Commandes'){
    invs = [
      'Création',
      'Remplacement appareillage',
      'Recâblage avec remplacement appareillage',
      'Recâblage sans remplacement appareillage'
    ];
  } else {
    invs = ['Création'];
  }
  var invOpts = invs.map(i=>'<option value="'+i+'">'+i+'</option>').join('');

  // 2) Désignation
  var desigHtml = '', defaultDesignation = '';
  if(cat==='Prises'){
    defaultDesignation = 'Prise';
    desigHtml = '<div class="pill"><strong>Désignation : Prise</strong></div>';
  } else if(cat==='Éclairage/Luminaires' || cat==='Éclairage/Commandes'){
    var list = DESIGNATIONS_PAR_CATEGORIE[cat] || ['Élément'];
    defaultDesignation = list[0];
    desigHtml = '<label style="margin-top:10px;">Désignation</label>'
              + '<select id="oneshot-desig">'
              + list.map(d=>'<option value="'+d+'">'+d+'</option>').join('')+'</select>';
  } else if(cat==='Circuit spécialisé'){
    defaultDesignation = 'Circuit spécialisé';
    desigHtml = '<label style="margin-top:10px;">Libellé (optionnel)</label>'
              + '<input id="oneshot-custom-desig" placeholder="ex : Four, PAC… (facultatif)" />';
  } else {
    defaultDesignation = 'Élément';
    desigHtml = '<label>Désignation</label><input id="oneshot-custom-desig" placeholder="Élément" />';
  }

  // 3) Pose (sera masquée si intervention ≠ Création)
  var poseOpts  = POSES.map(p=>'<option value="'+p+'">'+p+'</option>').join('');
  var poseBlock = '<div id="oneshot-pose-wrap">'
                +   '<label>Type de pose</label><select id="oneshot-pose">'+poseOpts+'</select>'
                + '</div>';

  // 4) Section (CS uniquement, et masquée si intervention ≠ Création)
  var sectionBlock = '';
  if(cat==='Circuit spécialisé'){
    var sectOpts = SECTIONS_CABLE.map(s=>'<option value="'+s+'">'+s+'</option>').join('');
    sectionBlock = '<div id="oneshot-section-wrap" style="margin-top:10px;">'
                 +   '<label>Section</label><select id="oneshot-section">'+sectOpts+'</select>'
                 + '</div>';
  }

  // 5) Quantité
  var qtyOpts = Array.from({length:30},(_,i)=>'<option '+(i===0?'selected':'')+'>'+(i+1)+'</option>').join('');

  // UI
  var backFn = (cat && cat.indexOf('Éclairage/')===0) ? 'goEclairageSub()' : 'goPiece('+JSON.stringify(ctx.piece)+')';
  view(
    '<div class="card">'
      + b('Retour', backFn, 'btn back')
      + '<h2>'+cat+' — '+pieceDisplayLabel(ctx.piece)+'</h2>'
      + '<label>Intervention</label><select id="oneshot-interv">'+invOpts+'</select>'
      + desigHtml
      + poseBlock
      + sectionBlock
      + '<label style="margin-top:10px;">Quantité</label>'
      + '<select id="oneshot-qty">'+qtyOpts+'</select>'
      + '<div id="oneshot-preview" class="muted" style="margin-top:10px;"></div>'
      + '<div class="row" style="margin-top:14px; gap:8px;">'
        + b('Ajouter la ligne','saveOneShotItem(false)','btn primary')
        + b('Ajouter et rester','saveOneShotItem(true)','btn')
      + '</div>'
    + '</div>'
  );

  // ----- Comportement : masquage dynamique selon intervention
  function isCreation(interv){ return String(interv||'')==='Création'; }

  function applyInterventionVisibility(){
    var interv = document.getElementById('oneshot-interv').value;
    var poseWrap = document.getElementById('oneshot-pose-wrap');
    var sectionWrap = document.getElementById('oneshot-section-wrap');

    // Pose : visible uniquement en Création (toutes catégories)
    if(poseWrap){
      poseWrap.style.display = isCreation(interv) ? '' : 'none';
    }
    // Section : visible uniquement en Création ET catégorie = Circuit spécialisé
    if(sectionWrap){
      sectionWrap.style.display = (isCreation(interv) && cat==='Circuit spécialisé') ? '' : 'none';
    }
    refreshPreview(); // tenir compte du masquage dans le calcul
  }

  // ----- Aperçu PU/Total
  function refreshPreview(){
    var interv = document.getElementById('oneshot-interv').value;

    // Désignation choisie
    var desig  = defaultDesignation;
    var selDes = document.getElementById('oneshot-desig');
    var custom = document.getElementById('oneshot-custom-desig');
    if(selDes) desig = selDes.value;
    if(custom && custom.value.trim()) desig = custom.value.trim();

    // Pose / Section : seulement si visibles (Création)
    var poseEl = document.getElementById('oneshot-pose-wrap');
    var sectionEl = document.getElementById('oneshot-section-wrap');

    var pose   = (poseEl && poseEl.style.display!=='none') ? (document.getElementById('oneshot-pose').value||'') : '';
    var section= (sectionEl && sectionEl.style.display!=='none') ? ((document.getElementById('oneshot-section')||{}).value||'') : '';

    var pu = (typeof computePU==='function') ? computePU(cat, desig, interv, pose, section) : 0;
    var q  = parseInt(document.getElementById('oneshot-qty').value,10)||1;
    document.getElementById('oneshot-preview').innerHTML = 'PU : '+euro(pu)+' — Total : '+euro(pu*q);
  }

  // Events
  ['oneshot-interv','oneshot-pose','oneshot-section','oneshot-desig','oneshot-custom-desig','oneshot-qty']
    .forEach(function(id){ var el=document.getElementById(id); if(el) el.addEventListener('input', function(){ 
      if(id==='oneshot-interv') applyInterventionVisibility(); else refreshPreview();
    }); });

  // Init
  applyInterventionVisibility();
}

function saveOneShotItem(stayHere){
  var cat  = ctx.category;
  var interv = document.getElementById('oneshot-interv').value;

  // Si non Création → ne pas prendre pose/section
  var poseWrap = document.getElementById('oneshot-pose-wrap');
  var sectionWrap = document.getElementById('oneshot-section-wrap');

  var pose   = (poseWrap && poseWrap.style.display!=='none') ? (document.getElementById('oneshot-pose').value||'') : '';
  var section= (sectionWrap && sectionWrap.style.display!=='none') ? ((document.getElementById('oneshot-section')||{}).value||'') : '';

  var qty    = parseInt(document.getElementById('oneshot-qty').value,10)||1;

  var desig = 'Élément';
  if(cat==='Prises'){ desig='Prise'; }
  else {
    var selDes = document.getElementById('oneshot-desig');
    var custom = document.getElementById('oneshot-custom-desig');
    if(selDes) desig = selDes.value;
    if(custom && custom.value.trim()) desig = custom.value.trim();
  }

  var pu = (typeof computePU==='function') ? computePU(cat, desig, interv, pose, section) : 0;

  ensureSection(ctx.piece);
  devis[ctx.piece].items.push({
    category: cat,
    intervention: interv,
    pose: pose, // vide si non Création (d’où affichage cohérent en liste)
    designation: (cat==='Circuit spécialisé' && desig==='Circuit spécialisé')
                  ? (desig + (section?(' — '+section):'')) : desig + (section?(' — '+section):''),
    qty: qty,
    prixU: pu,
    __tabKey: ctx.piece
  });
  saveLocal();
  if(stayHere){ pageOneShotSelection(); } else { goPiece(ctx.piece); }
}
</script>

function getTabPrice(rangs, modules, pose, intervention){

    const base = (TARIFS_TABLEAU.pose_base_13[rangs]||0);
    const cm = (TARIFS_TABLEAU.coef.modules[modules]||1);
    const cp = (TARIFS_TABLEAU.coef.pose[pose]||1);
    const ci = (TARIFS_TABLEAU.coef.intervention[intervention]||1);
    return roundUp5(base*cm*cp*ci);
  }catch(e){ return 0; }
}
</script>

function pageTab_DisjSaveDetails(key, rating){
  const types=[...document.querySelectorAll('.dj-type')];
  const notes=[...document.querySelectorAll('.dj-note')];
  const details=[];
  let idx=0;
  function next(){
    if(idx>=types.length){
      if(!tabState.disj[rating]) tabState.disj[rating]={qty:0,details:[]};
      tabState.disj[rating].details=details;
      saveLocal(); pageTab_Disjoncteurs(key);
      return;
    }
    const i=idx++;
    let t=types[i]?.value||'';
    const n=notes[i]?.value||'';
    if(t==="__custom__"){
      showInlinePrompt('Nom personnalisé du circuit :', '', function(v){
        t = (v||"Circuit "+(i+1));
        details.push({type:t,note:n});
        next();
      });
    } else {
      details.push({type:t,note:n});
      next();
    }
  }
  next();
}
function pageTab_DisjValider(key){
  saveDisjQtyFromUI();
  const PU=Object.assign({}, (TARIFS_TABLEAU && TARIFS_TABLEAU.disjoncteurs)?TARIFS_TABLEAU.disjoncteurs:{}, {40:45});
  ensureTableauKey(key);

  [2,10,16,20,32,40].forEach(r=>{
    const st=tabState.disj[r];
    if(st && st.qty>0){
      const hasDetail=Array.isArray(st.details)&&st.details.some(d=>d&&(d.type||d.note));
      const detailText=hasDetail?' — circuits : '+st.details.map((d,i)=>(d.type||('Circuit '+(i+1)))+(d.note?(' ('+d.note+')'):'')).join(', '):'';
      devis[key].items.push({
        category:"Tableau/Modulaire",
        designation:`Disjoncteur ${r} A${detailText}`,
        qty:st.qty, prixU:PU[r]||0, __tabKey:key
      });
    }
  });

  const c=tabState.disj.__custom__;
  if(c && c.qty>0){
    const label=(c.label||"Calibre personnalisé").trim();
    const hasDetail=Array.isArray(c.details)&&c.details.some(d=>d&&(d.type||d.note));
    const detailText=hasDetail?' — circuits : '+c.details.map((d,i)=>(d.type||('Circuit '+(i+1)))+(d.note?(' ('+d.note+')'):'')).join(', '):'';
    showInlinePrompt("Prix unitaire pour « "+label+" » (€) :", '0', function(v){
      const pu=parseFloat(v||"0")||0;
      devis[key].items.push({
        category:"Tableau/Modulaire",
        designation:`Disjoncteur ${label}${detailText}`,
        qty:c.qty, prixU:pu, __tabKey:key
      });
      saveLocal(); pageTabHome(key);
    });
    return;
  }
  saveLocal(); pageTabHome(key);
}
</script>

<script>
// ========== Merge util ==========
function deepMergeTarifs(base, override){
  if(!override || typeof override!=='object') return;
  Object.keys(override).forEach(function(k){
    var ov = override[k];
    if(ov && typeof ov==='object' && !Array.isArray(ov)){
      if(!base[k] || typeof base[k]!=='object') base[k] = {};
      deepMergeTarifs(base[k], ov);
    } else {
      base[k] = ov;
    }
  });
}

// ========== Load / Save overrides ==========
function loadTarifsOverrides(){
  try{
    var raw = localStorage.getItem('tarifsOverrides');
    if(!raw) return;
    var ov = JSON.parse(raw||'{}')||{};
    // Fusion avec les objets globaux du Chapitre 3
    if(ov.TARIFS_BASE) deepMergeTarifs(TARIFS_BASE, ov.TARIFS_BASE);
    if(ov.COEFF_POSE) deepMergeTarifs(COEFF_POSE, ov.COEFF_POSE);
    if(ov.COEFF_SECTIONS_CS) deepMergeTarifs(COEFF_SECTIONS_CS, ov.COEFF_SECTIONS_CS);
  }catch(e){}
}
function saveTarifsOverrides(partialOv){
  try{
    var cur = JSON.parse(localStorage.getItem('tarifsOverrides')||'{}')||{};
    deepMergeTarifs(cur, partialOv||{});
    localStorage.setItem('tarifsOverrides', JSON.stringify(cur));
    alert('✅ Paramètres sauvegardés.');
  }catch(e){ alert('Impossible de sauvegarder les paramètres.'); }
}

// Charger d’éventuels overrides dès le chargement de ce chapitre
loadTarifsOverrides();

function _tfVal(id){ var el=document.getElementById(id); return parseFloat(el && el.value || '0')||0; }
function _setVal(id, v){ var el=document.getElementById(id); if(el) el.value = (v!=null?v:''); }

<script>
// ---------- Stockage ----------
const CUSTOM_SCHEMA_KEY = 'tarifsCustomSchema';

// ---------- Helpers merge (ajouts SANS écrasement du tronc) ----------
function addUniqueToArray(baseArr, addArr){
  if(!Array.isArray(baseArr) || !Array.isArray(addArr)) return;
  addArr.forEach(v => { if(baseArr.indexOf(v) === -1) baseArr.push(v); });
}
function mergeObjectAddOnly(base, add){
  if(!add || typeof add!=='object') return;
  Object.keys(add).forEach(k=>{
    const v = add[k];
    if(base[k] == null){
      // clé nouvelle → on ajoute telle quelle
      base[k] = Array.isArray(v) ? v.slice() : (typeof v==='object' ? JSON.parse(JSON.stringify(v)) : v);
    }else{
      // clé existante → on N'ÉCRASE PAS, on complète seulement
      if(Array.isArray(base[k]) && Array.isArray(v)) addUniqueToArray(base[k], v);
      else if(typeof base[k]==='object' && typeof v==='object') mergeObjectAddOnly(base[k], v);
      // sinon (nombre/string déjà défini) → on ne touche pas
    }
  });
}

// ---------- Application du schéma perso au runtime ----------
function applyCustomSchema(){
  let custom;
  try{ custom = JSON.parse(localStorage.getItem(CUSTOM_SCHEMA_KEY)||'{}')||{}; }catch(e){ custom = {}; }

  // 1) Listes “simples” (catégories, poses, sections) — ajouts only
  if(Array.isArray(custom.CATEGORIES))        addUniqueToArray(CATEGORIES, custom.CATEGORIES);
  if(Array.isArray(custom.POSES))             addUniqueToArray(POSES, custom.POSES);
  if(Array.isArray(custom.SECTIONS_CABLE))    addUniqueToArray(SECTIONS_CABLE, custom.SECTIONS_CABLE);

  // 2) Désignations par branche (ex: "Éclairage/Luminaires": ["Rail LED", ...])
  if(custom.DESIGNATIONS_PAR_CATEGORIE && typeof custom.DESIGNATIONS_PAR_CATEGORIE==='object'){
    Object.keys(custom.DESIGNATIONS_PAR_CATEGORIE).forEach(cat=>{
      const adds = custom.DESIGNATIONS_PAR_CATEGORIE[cat];
      if(!Array.isArray(adds)) return;
      if(!DESIGNATIONS_PAR_CATEGORIE[cat]) DESIGNATIONS_PAR_CATEGORIE[cat] = [];
      addUniqueToArray(DESIGNATIONS_PAR_CATEGORIE[cat], adds);
    });
  }

  // 3) Tarifs pour les NOUVELLES désignations d’éclairage (on n’écrase pas les existantes)
  //    Format attendu :
  //    { "TARIFS_BASE": { "eclairage": { "Ma nouvelle désignation": { "Création": 120, ... } } } }
  if(custom.TARIFS_BASE && custom.TARIFS_BASE.eclairage){
    const src = custom.TARIFS_BASE.eclairage;
    Object.keys(src).forEach(desig=>{
      if(!TARIFS_BASE.eclairage[desig]) TARIFS_BASE.eclairage[desig] = {}; // nouvelle désignation permise
      mergeObjectAddOnly(TARIFS_BASE.eclairage[desig], src[desig]);        // ajoute interventions sans écraser celles déjà présentes
    });
  }

  // 4) (facultatif) coefficients de pose/sections — ajoute les nouvelles clés uniquement
  if(custom.COEFF_POSE)           mergeObjectAddOnly(COEFF_POSE, custom.COEFF_POSE);
  if(custom.COEFF_SECTIONS_CS)    mergeObjectAddOnly(COEFF_SECTIONS_CS, custom.COEFF_SECTIONS_CS);
}
// Applique au chargement du chapitre
applyCustomSchema();

// ---------- UI ----------

  // modèle minimal affiché si aucun JSON encore enregistré
  const example = JSON.stringify({

    },

          "Remplacement luminaire": 40
        },
        "Variateur rotatif": {
          "Création": 55,
          "Remplacement appareillage": 30
        }
      }
    }
  }, null, 2);

  let current = '';
  try{ current = localStorage.getItem(CUSTOM_SCHEMA_KEY) || ''; }catch(e){}

  view(
    '<div class="tarif-wrap">'
    + '<div class="card tarif-card">'
      + b('Retour','pageTarifsAccueil()','btn back')
      + '<h2>Personnalisation avancée (JSON)</h2>'
      + '<p class="muted">Ajoute catégories, poses, sections, désignations et <em>tarifs pour les nouvelles désignations</em>. Le tronc existant n’est jamais écrasé.</p>'
      + '<label>JSON (ajouts only)</label>'
      + '<textarea id="custom-json" style="width:100%;height:320px;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;"></textarea>'
      + '<div class="tarif-actions">'
        + b('💾 Enregistrer','saveTarifsPersoJSON()','btn primary')
        + b('🧹 Réinitialiser','resetTarifsPersoJSON()','btn')
        + b('⬇️ Exporter','exportTarifsPersoJSON()','btn')
        + b('⬆️ Importer','importTarifsPersoJSON()','btn')
      + '</div>'
      + '<details style="margin-top:12px;"><summary>Exemple de structure</summary>'
      + '<pre style="margin-top:8px">'+escapeHtml(example)+'</pre>'
      + '</details>'
    + '</div>'
    + '</div>'
  );

  // remplir la zone
  const ta = document.getElementById('custom-json');
  ta.value = current || example;
}

function saveTarifsPersoJSON(){
  const ta = document.getElementById('custom-json');
  let obj;
  try{
    obj = JSON.parse(ta.value);
  }catch(e){
    alert('❌ JSON invalide : '+e.message);
    return;
  }
  // garde-fous simples : seules ces racines sont acceptées
  const allowed = ['CATEGORIES','POSES','SECTIONS_CABLE','DESIGNATIONS_PAR_CATEGORIE','TARIFS_BASE','COEFF_POSE','COEFF_SECTIONS_CS'];
  const ok = Object.keys(obj).every(k=>allowed.indexOf(k)>=0);
  if(!ok){ alert('❌ Clés non autorisées au niveau racine. Racines valides : '+allowed.join(', ')); return; }

  localStorage.setItem(CUSTOM_SCHEMA_KEY, JSON.stringify(obj));
  applyCustomSchema();
  alert('✅ Ajouts enregistrés. Ils sont utilisables immédiatement.');
}

function resetTarifsPersoJSON(){
  if(!confirm('Réinitialiser toutes les personnalisations JSON ?')) return;
  localStorage.removeItem(CUSTOM_SCHEMA_KEY);
  // recharger les listes runtime (on repart sur le tronc)
  location.reload();
}

function exportTarifsPersoJSON(){
  const raw = localStorage.getItem(CUSTOM_SCHEMA_KEY) || '{}';
  const blob = new Blob([raw], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'minidevis_personnalisation.json';
  a.click(); URL.revokeObjectURL(url);
}

function importTarifsPersoJSON(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json';
  input.onchange = function(){
    const f = input.files && input.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      try{
        const obj = JSON.parse(rd.result||'{}');
        localStorage.setItem(CUSTOM_SCHEMA_KEY, JSON.stringify(obj));
        applyCustomSchema();
        alert('✅ Fichier importé et appliqué.');
        pageTarifsPersoJSON();
      }catch(e){ alert('❌ Import impossible : '+e.message); }
    };
    rd.readAsText(f, 'utf-8');
  };
  input.click();
}

        + '<label class="vblock">Modules par rangée</label>'
        + '<select id="rc-mod">'+modules+'</select>'
        + '<label class="vblock">Nombre de rangées</label>'
        + '<select id="rc-range">'+ranges+'</select>'
        + '<label class="vblock">Type de pose</label>'
        + '<select id="rc-pose"><option>Saillie</option><option>Encastré</option></select>'
        + '<small class="muted vblock">Estimation simple : base + rangées × modules, coef encastré.</small>'
      + '</div>'

      + '<div id="mt-preview" class="muted mtx"></div>'

      + '<div class="row mtx" style="gap:8px;">'
        + b('Ajouter la modification','addTabMod_Deplacement()','btn primary')
      + '</div>'
    + '</div>'
  );

  ['mt-circuits','mt-boite','mt-goulotte','rc-gamme','rc-mod','rc-range','rc-pose'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.addEventListener('input', refreshMtPreview);
  });
  refreshMtPreview();
}

function calcDeplacementTotal(nbCircuits, boiteId, lgM){
  const t = TARIFS_TABMODS.deplacement || {};
  const parCircuit = +t.par_circuit || 20;
  const bBase = (boiteId==='NONE') ? 0 : (+t.boite_base || 50);
  const bPerC = (boiteId==='NONE') ? 0 : (+t.boite_par_circuit || 10);
  const gBase = +t.goulotte_base || 50;
  const gPerM = +t.goulotte_par_m || 20;
  return roundUp5(nbCircuits*parCircuit + bBase + nbCircuits*bPerC + gBase + (Math.max(0,+lgM)*gPerM));
}
function calcRemplacementCoffretTotal(rang, modTxt, pose){
  const m = /(\d+)/.exec(modTxt||''); const mod = m? +m[1] : 13;
  const basePrix=100, coefPose=(pose==='Encastré'?1.7:1);
  return roundUp5(basePrix*coefPose*( (+rang||1) * (mod/13) ));
}

function refreshMtPreview(){
  const n  = +document.getElementById('mt-circuits').value || 0;
  const b  = document.getElementById('mt-boite').value;
  const lm = +document.getElementById('mt-goulotte').value || 0;

  const gamme = document.getElementById('rc-gamme').value;
  const mod   = document.getElementById('rc-mod').value;
  const rang  = (document.getElementById('rc-range').value||'').replace(/\D/g,'')||'1';
  const pose  = document.getElementById('rc-pose').value;

  const lblBoite = (b==='NONE') ? 'Aucune boîte' : (TABMODS_BOITES.find(x=>x.id===b)?.label || b);
  const t1 = calcDeplacementTotal(n,b,lm);
  let recap = `Récap déplacement : ${n} circuit(s) — ${lblBoite} — goulotte ${lm.toFixed(1)} m → <strong>${euro(t1)}</strong>`;

  if(gamme && gamme!=='Aucun'){
    const t2 = calcRemplacementCoffretTotal(+rang, mod, pose);
    recap += `<br>Remplacement coffret : ${rang} rangée(s) — ${mod} — ${gamme} — Pose ${pose} → <strong>${euro(t2)}</strong>`;
  }else{
    recap += `<br>Remplacement coffret : <em>non sélectionné</em>`;
  }

  document.getElementById('mt-preview').innerHTML = recap;
}

function addTabMod_Deplacement(){
  const n  = +document.getElementById('mt-circuits').value || 0;
  const b  = document.getElementById('mt-boite').value;
  const lm = +document.getElementById('mt-goulotte').value || 0;
  const lbl = (b==='NONE') ? 'Aucune boîte' : (TABMODS_BOITES.find(x=>x.id===b)?.label || b);
  const totalDep = calcDeplacementTotal(n,b,lm);

  const gamme = document.getElementById('rc-gamme').value;
  const mod   = document.getElementById('rc-mod').value;
  const rang  = (document.getElementById('rc-range').value||'').replace(/\D/g,'')||'1';
  const pose  = document.getElementById('rc-pose').value;

  ensureTabModsSection();
  // Ligne 1 : Déplacement
  devis[TABMODS_SECTION_KEY].items.push({
    category:'Modification emplacement Tableau',
    designation:`Circuits à rallonger : ${n} — Boîte : ${lbl} — Goulotte : ${lm.toFixed(1)} m`,
    qty:1, prixU:totalDep
  });

  // Ligne 2 (facultative) : Remplacement coffret
  if(gamme && gamme!=='Aucun'){
    const totalCof = calcRemplacementCoffretTotal(+rang, mod, pose);
    devis[TABMODS_SECTION_KEY].items.push({
      category:'Remplacement coffret',
      designation:`${gamme} — ${rang} rangée(s) × ${mod} — Pose ${pose}`,
      qty:1, prixU:totalCof
    });
  }

  saveLocal();
  alert('✅ Modification ajoutée à l’estimatif.');
  pageTabModsAccueil();
}

// =============================================================
// §9.4 • Recâblage tableau existant
//   - Remplacement coffret (sans “dépose existant”)
//   - Nb de circuits à recâbler (10€ / u)
//   - Matériel supplémentaire (sélecteur multi-lignes)
// =============================================================
let _recab_suppl = []; // { type, qty, pu }

function pageTabModsRecablage(){
  const marques = ['Aucun'].concat(TABMODS_COFFRET_GAMMES).map(m=>`<option value="${m}">${m}</option>`).join('');
  const modules = TABMODS_COFFRET_MODULES.map(m=>`<option value="${m}">${m}</option>`).join('');
  const ranges  = TABMODS_COFFRET_RANGES.map(r=>`<option value="${r}">${r} rangée(s)</option>`).join('');
  const circuits = Array.from({length:31},(_,i)=>`<option value="${i}">${i}</option>`).join('');

  const MAT = TARIFS_TABMODS.recablage.materiel || {};
  const types = Object.keys(MAT);
  const typeOptions = types.map(t=>`<option value="${t}">${t}</option>`).join('');

  // tableau lignes matérielles actuelles
  function tableSuppl(){
    if(!_recab_suppl.length) return '<div class="muted">Aucun matériel ajouté.</div>';
    const rows = _recab_suppl.map((it,i)=>(
      `<tr>
        <td>${it.type}</td>
        <td style="text-align:right">${(+it.pu||0).toFixed(2)} €</td>
        <td style="text-align:right">${(+it.qty||0)}</td>
        <td style="text-align:right">${(+it.pu*(+it.qty)).toFixed(2)} €</td>
        <td>${b('×','recabDel('+i+')','btn')}</td>
      </tr>`
    )).join('');
    return `<table class="table-mini">
      <thead><tr><th>Élément</th><th>PU</th><th>Qté</th><th>Total</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  view(
    '<div class="card">'
      + b('Retour','pageTabModsAccueil()','btn back')
      + '<h2>Recâblage tableau existant</h2>'

      + '<div class="fieldset">'
        + '<h3>1) Remplacement coffret (facultatif)</h3>'
        + '<label class="vblock">Marque / Gamme</label>'
        + '<select id="rb-gamme">'+marques+'</select>'
        + '<label class="vblock">Modules par rangée</label>'
        + '<select id="rb-mod">'+modules+'</select>'
        + '<label class="vblock">Nombre de rangées</label>'
        + '<select id="rb-range">'+ranges+'</select>'
        + '<label class="vblock">Type de pose</label>'
        + '<select id="rb-pose"><option>Saillie</option><option>Encastré</option></select>'
      + '</div>'

      + '<div class="fieldset">'
        + '<h3>2) Circuits à recâbler</h3>'
        + '<select id="rb-circuits">'+circuits+'</select>'
        + '<small class="muted vblock">Tarif : '+euro(+TARIFS_TABMODS.recablage.par_circuit||10)+' / circuit</small>'
      + '</div>'

      + '<div class="fieldset">'
        + '<h3>3) Matériel supplémentaire</h3>'
        + '<div class="row gap8">'
          + '<select id="rb-type">'+typeOptions+'</select>'
          + '<input id="rb-pu" type="number" inputmode="decimal" step="0.1" min="0" placeholder="PU (€)" />'
          + '<input id="rb-qty" type="number" inputmode="numeric" step="1" min="1" value="1" placeholder="Qté" />'
          + b('Ajouter','recabAdd()','btn')
        + '</div>'
        + '<div id="rb-table" class="mtx">'+tableSuppl()+'</div>'
      + '</div>'

      + '<div id="rb-preview" class="muted mtx"></div>'
      + '<div class="row mtx" style="gap:8px;">'
        + b('Ajouter au devis','addTabMod_Recablage()','btn primary')
      + '</div>'
    + '</div>'
  );

  // init champs PU auto
  const sel = document.getElementById('rb-type');
  const puIn = document.getElementById('rb-pu');
  const setDefaultPU = ()=>{ const k = sel.value; const d = (TARIFS_TABMODS.recablage.materiel||{})[k]||0; puIn.value = (+d||0).toFixed(2); };
  if(sel){ sel.addEventListener('change', setDefaultPU); setDefaultPU(); }

  ['rb-gamme','rb-mod','rb-range','rb-pose','rb-circuits'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.addEventListener('input', refreshRecabPreview);
  });
  refreshRecabPreview();

  // expose handlers locaux
  window.recabAdd = function(){
    const type = (document.getElementById('rb-type')?.value||'').trim();
    const pu   = parseFloat(document.getElementById('rb-pu')?.value)||0;
    const qty  = parseInt(document.getElementById('rb-qty')?.value,10)||1;
    if(!type || pu<=0 || qty<=0) return;
    _recab_suppl.push({type, pu:+pu, qty:+qty});
    pageTabModsRecablage();
  };
  window.recabDel = function(i){
    _recab_suppl.splice(i,1);
    pageTabModsRecablage();
  };
}

function calcRecabCoffret(gamme, rang, modTxt, pose){
  if(!gamme || gamme==='Aucun') return 0;
  return calcRemplacementCoffretTotal(+rang, modTxt, pose);
}
function calcRecabCircuits(n){ return roundUp5( ( +TARIFS_TABMODS.recablage.par_circuit || 10 ) * Math.max(0,+n) ); }
function calcRecabSupplTotal(){
  return roundUp5((_recab_suppl||[]).reduce((s,it)=> s + ((+it.pu||0)*(+it.qty||0)), 0));
}

function refreshRecabPreview(){
  const gamme = document.getElementById('rb-gamme')?.value || 'Aucun';
  const mod   = document.getElementById('rb-mod')?.value || '13 modules';
  const rang  = (document.getElementById('rb-range')?.value||'1').replace(/\D/g,'')||'1';
  const pose  = document.getElementById('rb-pose')?.value || 'Saillie';
  const n     = +document.getElementById('rb-circuits')?.value || 0;

  const tCof = calcRecabCoffret(gamme, rang, mod, pose);
  const tCir = calcRecabCircuits(n);
  const tSup = calcRecabSupplTotal();
  const total = roundUp5(tCof + tCir + tSup);

  document.getElementById('rb-preview').innerHTML =
    `Rempl. coffret : ${(gamme==='Aucun')?'—':`${rang} rangée(s) — ${mod} — ${gamme} — Pose ${pose} → <strong>${euro(tCof)}</strong>`}`
    + `<br>Circuits à recâbler : ${n} → <strong>${euro(tCir)}</strong>`
    + `<br>Matériel supplémentaire : <strong>${euro(tSup)}</strong>`
    + `<br>Total estimé : <strong>${euro(total)}</strong>`;
}

function addTabMod_Recablage(){
  const gamme = document.getElementById('rb-gamme')?.value || 'Aucun';
  const mod   = document.getElementById('rb-mod')?.value || '13 modules';
  const rang  = (document.getElementById('rb-range')?.value||'1').replace(/\D/g,'')||'1';
  const pose  = document.getElementById('rb-pose')?.value || 'Saillie';
  const n     = +document.getElementById('rb-circuits')?.value || 0;

  ensureTabModsSection();

  // (a) Remplacement coffret (si choisi)
  if(gamme && gamme!=='Aucun'){
    const tCof = calcRecabCoffret(gamme, rang, mod, pose);
    devis[TABMODS_SECTION_KEY].items.push({
      category:'Recâblage tableau existant — Remplacement coffret',
      designation:`${gamme} — ${rang} rangée(s) × ${mod} — Pose ${pose}`,
      qty:1, prixU:tCof
    });
  }
  // (b) Circuits à recâbler
  const tCir = calcRecabCircuits(n);
  devis[TABMODS_SECTION_KEY].items.push({
    category:'Recâblage tableau existant — Circuits',
    designation:`Nombre de circuits à recâbler : ${n}`,
    qty:1, prixU:tCir
  });
  // (c) Matériel supplémentaire (lignes détaillées)
  (_recab_suppl||[]).forEach(it=>{
    devis[TABMODS_SECTION_KEY].items.push({
      category:'Recâblage tableau existant — Matériel suppl.',
      designation:`${it.type}`,
      qty:+it.qty||1, prixU:+it.pu||0
    });
  });

  saveLocal();
  _recab_suppl = [];
  alert('✅ Recâblage ajouté à l’estimatif.');
  pageTabModsAccueil();
}

// =======================
// §9.5 • Expose (window)
// =======================
Object.assign(window,{
  pageTabModsAccueil,
  pageTabModsDeplacement,
  pageTabModsRecablage,
  addTabMod_Deplacement,
  addTabMod_Recablage
});
</script>










  


<!-- =============================
     CHAPITRE 10 : FACTURATION (export .txt)
     - Génère une facture texte
     - Mode 'séparé' : (v1) pas de décomposition matériel → tout en Prestations
     - Bouton injecté sur Estimatif & Totaux
     ============================= -->
<script>
/* ==== Helpers prefs/entreprise ==== */
function _getPrefsSafe(){
  try{ return JSON.parse(localStorage.getItem('appPrefs_v1')||'null') || {}; }catch(e){ return {}; }
}
function _getCompanySafe(){
  try{ return JSON.parse(localStorage.getItem('companyConfig_v1')||'null') || {}; }catch(e){ return {}; }
}
function _fmtEuro(n, sym){ var s = (sym || '€').trim(); return (+(n||0)).toFixed(2)+' '+s; }
function _todayFR(){ try{ return new Date().toLocaleDateString('fr-FR',{year:'numeric',month:'2-digit',day:'2-digit'}); }catch(e){ return new Date().toLocaleDateString(); } }

/* ==== Totaliseur devis courant ==== */
function _totalGlobalDevis(){
  var sum = 0;
  for (var key in devis){
    if(key.indexOf('__')===0) continue;
    var s = devis[key]; var items = (s&&s.items)||[];
    for (var i=0;i<items.length;i++){
      var it=items[i]; sum += ((+it.prixU||0) * (+it.qty||0));
    }
  }
  return sum;
}

/* ==== Génération du corps de facture (TXT) ==== */
function buildInvoiceText(){
  var prefs = _getPrefsSafe();
  var company = _getCompanySafe();
  var devise = prefs.devise || '€';

  var modeSepare = (prefs.facturation_mode === 'separe');

  var totalHT = _totalGlobalDevis(); // Montant HT global (tout compris)
  var totalPrest = totalHT; // v1 : sans décomposition, on impute 100% en prestations
  var totalMat   = 0;

  var tvaOn   = !!prefs.tva_applicable;
  var tauxTVA = Math.max(0, +prefs.taux_tva || 20);
  var tvaPrest= tvaOn ? (totalPrest * tauxTVA/100) : 0;
  var tvaMat  = tvaOn ? (totalMat   * tauxTVA/100) : 0;

  // En-tête société / facture
  var header = [];
  header.push('================= FACTURE (brouillon) =================');
  header.push('Date : '+_todayFR());
  var facPrefix = (prefs.numerotation_fact_prefix || 'FAC-');
  var numCourant= Math.max(1, parseInt(prefs.numerotation_courante||1,10));
  header.push('N° : '+facPrefix+String(numCourant).padStart(4,'0'));
  header.push('');
  header.push('Émetteur :');
  var rs = (company.raison_sociale || company.nom_commercial || '').trim();
  if(rs) header.push('  '+rs);
  var adr = [company.adresse, company.code_postal, company.ville].filter(Boolean).join(' ');
  if(adr) header.push('  '+adr);
  if(company.pays) header.push('  '+company.pays);
  if(company.email) header.push('  Email : '+company.email);
  if(company.telephone) header.push('  Tél   : '+company.telephone);
  if(company.siren) header.push('  SIREN : '+company.siren);
  if(company.tva_intracom) header.push('  TVA   : '+company.tva_intracom);
  header.push('========================================================');
  header.push('');

  // Corps
  var body = [];
  if(modeSepare){
    body.push('--- PRESTATIONS ---');
    body.push('Total Prestations (HT) : '+_fmtEuro(totalPrest, devise));
    if(tvaOn) body.push('TVA Prestations ('+tauxTVA+'%) : '+_fmtEuro(tvaPrest, devise));
    body.push('');
    body.push('--- MATÉRIEL ---');
    body.push('Total Matériel (HT) : '+_fmtEuro(totalMat, devise));
    if(tvaOn) body.push('TVA Matériel ('+tauxTVA+'%) : '+_fmtEuro(tvaMat, devise));
    body.push('');
    body.push('[Note] Mode “séparé” : v1 sans décomposition matérielle → tout imputé en Prestations.');
    body.push('');
  } else {
    body.push('--- TOTAL (fournitures + pose) ---');
    body.push('Montant HT : '+_fmtEuro(totalHT, devise));
    if(tvaOn) body.push('TVA ('+tauxTVA+'%) : '+_fmtEuro(totalHT * tauxTVA/100, devise));
    body.push('');
  }

  // Récap global
  var htGlobal  = totalPrest + totalMat;
  var tvaGlobal = tvaOn ? (modeSepare ? (tvaPrest + tvaMat) : (totalHT * tauxTVA/100)) : 0;

  body.push('================= RÉCAPITULATIF =================');
  body.push('Total HT  : '+_fmtEuro(modeSepare?htGlobal:totalHT, devise));
  if(tvaOn) body.push('TVA       : '+_fmtEuro(tvaGlobal, devise));
  body.push('Total TTC : '+_fmtEuro((modeSepare?htGlobal:totalHT) + tvaGlobal, devise));
  body.push('=================================================');
  body.push('');

  // Mentions / paiement
  var foot = [];
  if(company.conditions_paiement) foot.push('Conditions de paiement : '+company.conditions_paiement);
  if(company.iban) foot.push('IBAN : '+company.iban+(company.bic?(' — BIC : '+company.bic):''));
  if(company.rc_pro) foot.push('RC Pro : '+company.rc_pro);
  if(company.decennale) foot.push('Décennale : '+company.decennale);
  if(company.assureur) foot.push('Assureur : '+company.assureur);
  if(company.mentions_legales){
    foot.push('');
    foot.push(company.mentions_legales);
  }

  return header.concat(body).concat(foot).join('\r\n');
}

/* ==== Export .txt + incrément numérotation ==== */
function exportInvoiceText(){
  var prefs = _getPrefsSafe();
  try{
    var cur = Math.max(1, parseInt(prefs.numerotation_courante||1,10));
    prefs.numerotation_courante = cur + 1;
    localStorage.setItem('appPrefs_v1', JSON.stringify(prefs));
  }catch(e){}
  var name = (devis.__name || 'Devis').trim() || 'Devis';
  var blob = new Blob([buildInvoiceText()], {type:'text/plain;charset=utf-8'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url;
  a.download = name.replace(/\s+/g,'_').toLowerCase()+'_facture.txt';
  a.click();
  URL.revokeObjectURL(url);
  alert('✅ Facture (texte) exportée.');
}

/* ==== Injection du bouton dans Estimatif & Totaux ==== */
(function patchButtons(){
  var origEst = window.pageEstimatif;
  if(typeof origEst === 'function'){
    window.pageEstimatif = function(){
      origEst();
      var app = document.getElementById('app'); if(!app) return;
      if(app.innerHTML.indexOf('exportInvoiceText()')===-1){
        app.innerHTML = app.innerHTML.replace(
          /(Export \.zip \(complet\).*?<\/div>\s*<\/div>)/,
          '$1<div class="row" style="margin-top:10px;">'
          + '<button class="btn primary" onclick="exportInvoiceText()">🧾 Exporter facture (texte)</button>'
          + '</div>'
        );
      }
    };
  }
  var origTot = window.pageTotaux;
  if(typeof origTot === 'function'){
    window.pageTotaux = function(){
      origTot();
      var app = document.getElementById('app'); if(!app) return;
      if(app.innerHTML.indexOf('exportInvoiceText()')===-1){
        app.innerHTML = app.innerHTML.replace(
          /(Export \.zip \(complet\).*?<\/div>\s*<\/div>)/,
          '$1<div class="row" style="margin-top:10px;">'
          + '<button class="btn primary" onclick="exportInvoiceText()">🧾 Exporter facture (texte)</button>'
          + '</div>'
        );
      }
    };
  }
})();
</script>


  



  



  






  
  
<!-- =============================
     CHAPITRE 11 : ESTIMATIF & EXPORTS — COMPLET
     Index :
       §11.0 • Détection / libellé des pièces (Tableaux inclus)
       §11.1 • Tri dédié aux Tableaux (diff → coupure → disjoncteurs → reste)
       §11.2 • Pages : Estimatif détaillé & Totaux par groupe
       §11.3 • Exports : .txt par groupe / .zip par groupe
       §11.4 • Exports : complet .txt / complet .zip
       §11.5 • DEVIS (TXT) : tout compris & séparé Prestations/Matériel
     ============================= -->
<script>
// §11.0 • Détection & libellés
window.PIECE_GROUPS = window.PIECE_GROUPS || {
  "Buanderie":"Pièces techniques","Garage":"Pièces techniques","Atelier":"Pièces techniques",
  "Jardin":"Extérieur","Terrasse":"Extérieur","Balcon":"Extérieur","Abri de jardin":"Extérieur",
  "Cuisine":"Cuisine",
  "Salon":"Pièces de vie","Salle à manger":"Pièces de vie","Couloir":"Pièces de vie","Entrée":"Pièces de vie",
  "Salle de bain":"Pièces d'eau","Salle d'eau":"Pièces d'eau","Toilettes":"Pièces d'eau",
  "Chambre":"Chambres & Bureau",
  "Bureau":"Chambres & Bureau","Bibliothèque":"Chambres & Bureau",
  "Tableau":"Tableau & distribution","Distribution":"Tableau & distribution",
  "Mise à la terre":"Mise à la terre","VMC":"VMC"
};
function groupDevis(){
  var g = {};
  for (var key in devis){
    if (key.indexOf("__") === 0) continue;
    var s = devis[key];
    var base = (s && s.__base) ? s.__base : key.replace(/\s*\(.*\)\s*$/,"").split(" — ")[0];
    var grp  = window.PIECE_GROUPS[base] || "Divers";
    if (!g[grp]) g[grp] = {};
    g[grp][key] = s;
  }
  return g;
}
function isTableauKey(key){
  var s = devis[key] || {};
  return ((s.__base||'').toLowerCase()==='tableau') || /^Tableau\s/i.test(key);
}
function pieceDisplayLabel(key){
  var s = devis[key] || {};
  var base = (s && s.__base) ? s.__base : key.replace(/\s*\(.*\)\s*$/,"").split(" — ")[0];
  var qual = s.qualificatif || '';
  var etg  = s.etage || '';
  var label = base===key ? key : (base + (qual ? ' ('+qual+')':'') + (etg ? ' — '+etg:''));
  if(isTableauKey(key) && s.__customName && s.__customName.trim()){
    label = key + ' — ' + s.__customName.trim();
  }else{
    if(!isTableauKey(key)){
      label = (typeof formatPieceLabel === 'function') ? formatPieceLabel(key) : key;
    }else{
      label = key;
    }
  }
  return label;
}

// §11.1 • Tri dédié Tableaux
function sortedItemsForPiece(key, items){
  if(!Array.isArray(items)) return [];
  if(!isTableauKey(key)) return items.slice();

  function score(it){
    var d = (it && it.designation ? String(it.designation) : '').trim();
    if (/^ID\s/i.test(d))             return 0;
    if (/^Coupure générale/i.test(d)) return 1;
    if (/^Disjoncteur\s/i.test(d))    return 2;
    return 3;
  }
  return items.map(function(it, i){ return {it:it, i:i, s:score(it)}; })
              .sort(function(a,b){ return (a.s - b.s) || (a.i - b.i); })
              .map(function(x){ return x.it; });
}

// §11.2 • Pages : Estimatif + Totaux
function itemLine(it){
  var unit = it.unit || "u";
  var poseTxt = (it.intervention === "Création" && it.pose) ? (" - " + String(it.pose).toLowerCase()) : "";
  var left = it.intervention ? (it.intervention + " — ") : "";
  var pu = (+it.prixU || 0).toFixed(2);
  var q  = +it.qty || 0;
  var total = (q * (+it.prixU || 0)).toFixed(2);
  return "- " + left + it.designation + poseTxt + " | Qté: " + q + " " + unit + " | PU: " + pu + "€ | Total: " + total + "€";
}
function pieceSeparator(label){ return "\n---------------- " + label + " ----------------\n"; }

function pageEstimatif(){
  var html = '<div class="card">'+b("Retour","pageHome()","btn back")+'<h2>Estimatif détaillé</h2>';
  var totalGlobal = 0;
  var grouped = groupDevis();

  for (var grp in grouped){
    html += '<h2 style="border-top:2px solid #000; padding-top:8px;">'+grp+'</h2>';
    var groupTotal = 0;

    for (var key in grouped[grp]){
      var s = grouped[grp][key];
      if (!s || !s.items || !s.items.length) continue;

      var pieceLabel = pieceDisplayLabel(key);
      var items = sortedItemsForPiece(key, s.items);
      var sectionTotal = 0;

      html += '<h3 style="margin-top:6px; border-top:1px solid #ccc; padding-top:4px;">'+pieceLabel+'</h3><ul>';
      items.forEach(function(it){
        var q  = +it.qty || 0;
        var pu = +it.prixU || 0;
        var t  = q * pu;
        sectionTotal += t; groupTotal += t; totalGlobal += t;

        var poseTxt = (it.intervention==="Création" && it.pose) ? (" " + String(it.pose).toLowerCase()) : "";
        var unit    = it.unit || "u";
        var left    = it.intervention ? (it.intervention+" — ") : "";
        html += '<li>' + left + it.designation + poseTxt + ' ('+q+' '+unit+' × '+euro(pu)+' = '+euro(t)+')</li>';
      });
      if (s.note) html += '<li><em>Note : '+s.note+'</em></li>';

      html += '</ul><p><strong>Total '+pieceLabel+' : '+euro(sectionTotal)+'</strong></p>';
    }

    html += '<p><strong>Total '+grp+' : '+euro(groupTotal)+'</strong></p><hr>';
  }

  html += '<h3>Total global : '+euro(totalGlobal)+'</h3>'
       +  '<div class="row" style="margin-top:10px;">'
       +    b("Export .txt (par groupe)","exportText()","btn")
       +    b("Export .zip (par groupe)","exportZipGroups()","btn")
       +    b("Export .txt (complet)","exportTextFull()","btn")
       +    b("Export .zip (complet)","exportZipFull()","btn")
       +  '</div>'
       +  '<div class="row" style="margin-top:10px;">'
       +    b("🧾 Export DEVIS (tout compris)","exportDevisToutComprisTXT()","btn primary")
       +    b("🧾 Export DEVIS (séparé)","exportDevisSepareTXT()","btn")
       +  '</div>'
       +  '</div>';

  view(html);
}

function pageTotaux(){
  var html = '<div class="card">'+b("Retour","pageHome()","btn back")+'<h2>Totaux par groupe</h2>';
  var totalGlobal = 0;
  var grouped = groupDevis();

  for (var grp in grouped){
    var gt = 0;
    for (var key in grouped[grp]){
      var s = grouped[grp][key];
      if (!s || !s.items || !s.items.length) continue;
      var items = sortedItemsForPiece(key, s.items);
      var st = items.reduce(function(sum,it){ return sum + (((+it.prixU)||0)*((+it.qty)||0)); }, 0);
      gt += st; totalGlobal += st;
    }
    html += '<p><strong>'+grp+'</strong> : '+euro(gt)+'</p>';
  }

  html += '<hr><p><strong>Total global : '+euro(totalGlobal)+'</strong></p>'
       +  '<div class="row" style="margin-top:10px;">'
       +    b("Export .txt (par groupe)","exportText()","btn")
       +    b("Export .zip (par groupe)","exportZipGroups()","btn")
       +    b("Export .txt (complet)","exportTextFull()","btn")
       +    b("Export .zip (complet)","exportZipFull()","btn")
       +  '</div>'
       +  '<div class="row" style="margin-top:10px;">'
       +    b("🧾 Export DEVIS (tout compris)","exportDevisToutComprisTXT()","btn primary")
       +    b("🧾 Export DEVIS (séparé)","exportDevisSepareTXT()","btn")
       +  '</div>'
       +  '</div>';

  view(html);
}

// §11.3 • Exports : TXT/ZIP par groupe
function exportText(){
  var grouped = groupDevis();
  for (var grp in grouped){
    var lines = ['=== '+grp+' ===\n'];
    var groupTotal = 0;

    for (var key in grouped[grp]){
      var s = grouped[grp][key];
      if (!s || !s.items || !s.items.length) continue;

      var label = pieceDisplayLabel(key);
      var items = sortedItemsForPiece(key, s.items);
      var st = 0;
      lines.push(pieceSeparator(label));

      items.forEach(function(it){
        var q = +it.qty || 0, pu = +it.prixU || 0, t = q * pu;
        st += t; groupTotal += t;
        lines.push(itemLine(it));
      });
      if (s.note) lines.push('Note : '+s.note);
      lines.push('Total '+label+' : '+st.toFixed(2)+'€\n');
    }

    lines.push('Total '+grp+' : '+groupTotal.toFixed(2)+'€');

    var blob = new Blob([lines.join('\r\n')], {type:'text/plain;charset=utf-8'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = 'devis_'+grp+'.txt'; a.click();
    URL.revokeObjectURL(url);
  }
  alert('✅ Export terminé : un fichier .txt par groupe généré.');
}

async function exportZipGroups(){
  if (typeof JSZip === 'undefined'){ alert('JSZip non chargé.'); return; }

  var grouped = groupDevis();
  var zip = new JSZip();
  var global = 0;

  for (var grp in grouped){
    var lines = ['=== '+grp+' ===\n'];
    var groupTotal = 0;

    for (var key in grouped[grp]){
      var s = grouped[grp][key];
      if (!s || !s.items || !s.items.length) continue;

      var label = pieceDisplayLabel(key);
      var items = sortedItemsForPiece(key, s.items);
      var st = 0;
      lines.push(pieceSeparator(label));

      items.forEach(function(it){
        var q = +it.qty || 0, pu = +it.prixU || 0, t = q * pu;
        st += t; groupTotal += t;
        lines.push(itemLine(it));
      });
      if (s.note) lines.push('Note : '+s.note);
      lines.push('Total '+label+' : '+st.toFixed(2)+'€\n');

  a.click(); URL.revokeObjectURL(url);

  alert('✅ Export ZIP (par groupe) généré.');
}

// §11.4 • Exports : COMPLET (.txt/.zip)
function buildFullText(){
  var grouped = groupDevis();
  var lines = ['=== DEVIS COMPLET ===\n'];
  var globalTotal = 0;

  for (var grp in grouped){
    lines.push('\n## '+grp+' ##\n');
    var groupTotal = 0;

    for (var key in grouped[grp]){
      var s = grouped[grp][key];
      if (!s || !s.items || !s.items.length) continue;

      var label = pieceDisplayLabel(key);
      var items = sortedItemsForPiece(key, s.items);
      var st = 0;
      lines.push(pieceSeparator(label));

      items.forEach(function(it){
        var q = +it.qty || 0, pu = +it.prixU || 0, t = q * pu;
        st += t; groupTotal += t; globalTotal += t;
        lines.push(itemLine(it));
      });
      if (s.note) lines.push('Note : '+s.note);
      lines.push('Total '+label+' : '+st.toFixed(2)+'€\n');
    }

    lines.push('Total '+grp+' : '+groupTotal.toFixed(2)+'€\n');
  }

  lines.push('\n=== Total global : '+globalTotal.toFixed(2)+'€ ===\n');
  return lines.join('\r\n');
}
function exportTextFull(){
  var name = (devis.__name || 'Devis').trim() || 'Devis';

  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');

  a.click(); URL.revokeObjectURL(url);
  alert('✅ Export .txt complet généré.');
}
async function exportZipFull(){
  if (typeof JSZip === 'undefined'){ alert('JSZip non chargé.'); return; }

  var name = (devis.__name || 'Devis').trim() || 'Devis';
  var zip  = new JSZip();

  var blob = await zip.generateAsync({type:'blob'});

  var a    = document.createElement('a');
  a.href = url; a.download = name.replace(/\s+/g,'_').toLowerCase()+'_complet.zip';
  a.click(); URL.revokeObjectURL(url);

/* =========================================================
   §11.5 • DEVIS (TXT) : tout compris & séparé P/M
   - S’appuie sur les prefs & coordonnées si le Chap.10 est chargé :
       _getPrefsSafe(), _getCompanySafe()
   - Sinon, retombe sur des valeurs par défaut.
   ========================================================= */
function _fmtDevTxt(n, sym){
  var s = (sym || '€').trim();
  return (+(n||0)).toFixed(2)+' '+s;
}
function _todayFR_dev(){
  try{ return new Date().toLocaleDateString('fr-FR',{year:'numeric',month:'2-digit',day:'2-digit'}); }
  catch(e){ return new Date().toLocaleDateString(); }
}
function _linesByGroup_dev(){
  var useAdvanced = (typeof groupDevis==='function') && (typeof pieceDisplayLabel==='function') && (typeof sortedItemsForPiece==='function');
  if(useAdvanced){
    var g = groupDevis();
    var out = [];
    for (var grp in g){
      for (var key in g[grp]){
        var s = g[grp][key];
        var items = sortedItemsForPiece(key, (s&&s.items)||[]);
        out.push({ group: grp, label: pieceDisplayLabel(key), items: items });
      }
    }
    return out;
  } else {
    var out2=[];
    for (var key2 in devis){
      if(key2.indexOf('__')===0) continue;
      var s2 = devis[key2]; if(!s2 || !Array.isArray(s2.items)||!s2.items.length) continue;
      out2.push({ group:'', label:key2, items:s2.items.slice() });
    }
    return out2;
  }
}
function _txtItemLine_dev(it, deviseSym){
  var unit = it.unit || 'u';
  var q  = +it.qty || 0;
  var pu = +it.prixU || 0;
  var t  = q*pu;
  var left = it.intervention ? (it.intervention+' — ') : '';
  var poseTxt = (it.intervention==='Création' && it.pose) ? (' - '+String(it.pose).toLowerCase()) : '';
  return '- ' + left + (it.designation||'') + poseTxt + ' ('
       + q+' '+unit+' × '+_fmtDevTxt(pu, deviseSym)+' = '+_fmtDevTxt(t, deviseSym)+')';
}

// DEVIS — tout compris (TXT)
function buildDevisText_ToutCompris(){
  var prefs   = (typeof _getPrefsSafe==='function')   ? _getPrefsSafe()   : {};
  var company = (typeof _getCompanySafe==='function') ? _getCompanySafe() : {};
  var devise  = prefs.devise || '€';
  var tvaOn   = !!prefs.tva_applicable;
  var tauxTVA = Math.max(0, +prefs.taux_tva || 20);

  var lines=[];
  lines.push('================= DEVIS — TOUT COMPRIS =================');
  lines.push('Date : '+_todayFR_dev());
  lines.push('');

  // Émetteur
  var rs = (company.raison_sociale || company.nom_commercial || '').trim();
  if(rs){ lines.push('Émetteur : '+rs); }
  var adr = [company.adresse, company.code_postal, company.ville].filter(Boolean).join(' ');
  if(adr) lines.push('Adresse  : '+adr+(company.pays?(' — '+company.pays):''));
  if(company.email) lines.push('Email    : '+company.email);
  if(company.telephone) lines.push('Tél      : '+company.telephone);
  if(company.siren) lines.push('SIREN    : '+company.siren);
  if(company.tva_intracom) lines.push('TVA      : '+company.tva_intracom);
  lines.push('========================================================');
  lines.push('');

  // Détail
  var blocks = _linesByGroup_dev();
  var totalHT = 0;
  var currentGroup = null;
  blocks.forEach(function(block){
    if(block.group && block.group!==currentGroup){
      lines.push('## '+block.group+' ##');
      currentGroup = block.group;
    }
    lines.push('---- '+block.label+' ----');
    var st=0;
    block.items.forEach(function(it){
      lines.push(_txtItemLine_dev(it, devise));
      st += ((+it.qty||0) * (+it.prixU||0));
    });
    lines.push('Total '+block.label+' : '+_fmtDevTxt(st, devise));
    lines.push('');
    totalHT += st;
  });

  // Totaux
  var tva = tvaOn ? (totalHT * tauxTVA/100) : 0;
  lines.push('================= RÉCAPITULATIF =================');
  lines.push('Total HT  : '+_fmtDevTxt(totalHT, devise));
  if(tvaOn) lines.push('TVA ('+tauxTVA+'%) : '+_fmtDevTxt(tva, devise));
  lines.push('Total TTC : '+_fmtDevTxt(totalHT + tva, devise));
  lines.push('=================================================');
  lines.push('');

  // Mentions
  if(company.conditions_paiement) lines.push('Conditions de paiement : '+company.conditions_paiement);
  if(company.iban) lines.push('IBAN : '+company.iban+(company.bic?(' — BIC : '+company.bic):''));
  if(company.mentions_legales){
    lines.push('');
    lines.push(company.mentions_legales);
  }
  return lines.join('\r\n');
}

// DEVIS — séparé Prestations / Matériel (TXT)
function buildDevisText_Separe(matPct){
  var prefs   = (typeof _getPrefsSafe==='function')   ? _getPrefsSafe()   : {};
  var company = (typeof _getCompanySafe==='function') ? _getCompanySafe() : {};
  var devise  = prefs.devise || '€';
  var tvaOn   = !!prefs.tva_applicable;
  var tauxTVA = Math.max(0, +prefs.taux_tva || 20);

  var matRatio   = Math.min(100, Math.max(0, parseFloat(matPct||40))) / 100;
  var prestRatio = 1 - matRatio;

  var lines=[];
  lines.push('============ DEVIS — SÉPARÉ PRESTATIONS / MATÉRIEL ============');
  lines.push('Date : '+_todayFR_dev());
  lines.push('');

  // Émetteur
  var rs = (company.raison_sociale || company.nom_commercial || '').trim();
  if(rs){ lines.push('Émetteur : '+rs); }
  var adr = [company.adresse, company.code_postal, company.ville].filter(Boolean).join(' ');
  if(adr) lines.push('Adresse  : '+adr+(company.pays?(' — '+company.pays):''));
  if(company.email) lines.push('Email    : '+company.email);
  if(company.telephone) lines.push('Tél      : '+company.telephone);
  if(company.siren) lines.push('SIREN    : '+company.siren);
  if(company.tva_intracom) lines.push('TVA      : '+company.tva_intracom);
  lines.push('===============================================================');
  lines.push('');

  // Détail (mêmes lignes qu'en tout compris)
  var blocks = _linesByGroup_dev();
  var totalHT = 0;
  var currentGroup = null;
  blocks.forEach(function(block){
    if(block.group && block.group!==currentGroup){
      lines.push('## '+block.group+' ##');
      currentGroup = block.group;
    }
    lines.push('---- '+block.label+' ----');
    var st=0;
    block.items.forEach(function(it){
      lines.push(_txtItemLine_dev(it, devise));
      st += ((+it.qty||0) * (+it.prixU||0));
    });
    lines.push('Total '+block.label+' : '+_fmtDevTxt(st, devise));
    lines.push('');
    totalHT += st;
  });

  // Split global
  var totalMatHT   = totalHT * matRatio;
  var totalPrestHT = totalHT * prestRatio;

  var tvaPrest = tvaOn ? (totalPrestHT * tauxTVA/100) : 0;
  var tvaMat   = tvaOn ? (totalMatHT   * tauxTVA/100) : 0;

  lines.push('================= RÉCAPITULATIF =================');
  lines.push('Hypothèse séparation : Matériel = '+Math.round(matRatio*100)+'% | Prestations = '+Math.round(prestRatio*100)+'%');
  lines.push('');
  lines.push('--- PRESTATIONS ---');
  lines.push('HT  : '+_fmtDevTxt(totalPrestHT, devise));
  if(tvaOn) lines.push('TVA : '+_fmtDevTxt(tvaPrest, devise));
  lines.push('');
  lines.push('--- MATÉRIEL ---');
  lines.push('HT  : '+_fmtDevTxt(totalMatHT, devise));
  if(tvaOn) lines.push('TVA : '+_fmtDevTxt(tvaMat, devise));
  lines.push('');
  lines.push('Total HT  : '+_fmtDevTxt(totalHT, devise));
  if(tvaOn) lines.push('Total TVA : '+_fmtDevTxt(tvaPrest + tvaMat, devise));
  lines.push('Total TTC : '+_fmtDevTxt(totalHT + (tvaPrest + tvaMat), devise));
  lines.push('=================================================');
  lines.push('');

  // Mentions
  if(company.conditions_paiement) lines.push('Conditions de paiement : '+company.conditions_paiement);
  if(company.iban) lines.push('IBAN : '+company.iban+(company.bic?(' — BIC : '+company.bic):''));
  if(company.mentions_legales){
    lines.push('');
    lines.push(company.mentions_legales);
  }
  return lines.join('\r\n');
}

// Exports .TXT (devis)
function exportDevisToutComprisTXT(){
  var name = (devis.__name || 'Devis').trim() || 'Devis';
  var blob = new Blob([buildDevisText_ToutCompris()], {type:'text/plain;charset=utf-8'});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = name.replace(/\s+/g,'_').toLowerCase()+'_devis_tout_compris.txt';
  a.click(); URL.revokeObjectURL(url);
  alert('✅ Devis (tout compris) exporté.');
}
function exportDevisSepareTXT(){
  showInlinePrompt('Pourcentage MATÉRIEL (0–100) ?', '40', function(pct){
    if(pct==null) return; // annulé
    var name = (devis.__name || 'Devis').trim() || 'Devis';
    var blob = new Blob([buildDevisText_Separe(pct)], {type:'text/plain;charset=utf-8'});
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = name.replace(/\s+/g,'_').toLowerCase()+'_devis_separe.txt';
    a.click(); URL.revokeObjectURL(url);
    alert('✅ Devis (séparé) exporté.');
  });
}
</script>

<script>
/* ============================================================

const KEY_COMPANY   = 'companyConfig_v1';
const KEY_PREFS     = 'appPrefs_v1';

function readJsonLS(key, def){ try{ return JSON.parse(localStorage.getItem(key)||'null') ?? def; }catch(e){ return def; } }
function writeJsonLS(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function getCompany(){

    // Identité
    raison_sociale: '', nom_commercial: '',
    siren: '', tva_intracom: '',
    adresse: '', code_postal: '', ville: '', pays: 'France',
    email: '', telephone: '', site: '',
    // Assurance / mentions
    rc_pro: '', decennale: '', assureur: '',
    iban: '', bic: '', conditions_paiement: 'Virement bancaire à 30 jours.',
    mentions_legales: '',
    // Logo (dataURL)
    logo_dataurl: '',
    logo_meta: { name:'', size:0, width:0, height:0, loaded_at:'' }
  });
}
function setCompany(obj){ writeJsonLS(KEY_COMPANY, obj||{}); }

function getPrefs(){
  // ➜ Ratio matériel supprimé (on bascule vers le catalogue)
  return readJsonLS(KEY_PREFS, {
    facturation_mode: 'tout_compris', // 'tout_compris' | 'separe'
    devise: '€',
    tva_applicable: false,  // pour futur « réel »
    taux_tva: 20,           // % (non utilisé tant que tva_applicable=false)
    numerotation_prefix: 'DEV-',
    numerotation_fact_prefix: 'FAC-',
    numerotation_courante: 1
  });
}
function setPrefs(obj){ writeJsonLS(KEY_PREFS, obj||{}); }

/* Fichier → dataURL + meta (nom/taille + dimensions) */
function fileToDataURLWithMeta(file, cb, errCb){
  try{
    const rd = new FileReader();
    rd.onload = function(){
      const dataUrl = rd.result || '';
      const img = new Image();
      img.onload = function(){
        cb({
          dataUrl,
          meta: {
            name: file.name || '',
            size: file.size || 0,
            width: img.naturalWidth||img.width||0,
            height: img.naturalHeight||img.height||0,
            loaded_at: new Date().toISOString()
          }
        });
      };
      img.onerror = function(){ (errCb||alert)('Impossible de lire l’image.'); };
      img.src = dataUrl;
    };
    rd.onerror = function(){ (errCb||alert)('Lecture du fichier échouée.'); };
    rd.readAsDataURL(file);
  }catch(e){ (errCb||alert)('Sélection d’image impossible : '+e.message); }
}

function pickImageFile(cb){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*';
  input.onchange = function(){
    const f = input.files && input.files[0]; if(!f) return;
    cb(f);
  };
  input.click();
}

function savePreferences(){
  const cur = getPrefs();
  function gv(id){ const el=document.getElementById(id); return el?el.value:''; }
  function gi(name){ const el=document.querySelector('input[name="'+name+'"]:checked'); return el?el.value:cur[name]; }
  const tvay = (gv('pf_tva_on')==='yes');

  const out = Object.assign({}, cur, {
    facturation_mode: gi('pf_fmode') || cur.facturation_mode,
    devise: gv('pf_dev') || cur.devise || '€',
    tva_applicable: tvay,
    taux_tva: Math.max(0, parseFloat(gv('pf_tva'))||cur.taux_tva||20),
    numerotation_prefix: gv('pf_pref_dev') || cur.numerotation_prefix || 'DEV-',
    numerotation_fact_prefix: gv('pf_pref_fac') || cur.numerotation_fact_prefix || 'FAC-',
    numerotation_courante: Math.max(1, parseInt(gv('pf_counter'),10)||cur.numerotation_courante||1)
  });
  setPrefs(out);
  alert('✅ Préférences enregistrées.');
}
