<script>
/* ============================================================
   13.1 • Stockage & Structure (alignée avec l’app)
   ------------------------------------------------------------
   - Familles : Prises / Éclairage(Luminaires, Commandes) / Circuit spécialisé
   - Chaque type possède ses tarifs par intervention (suivant la famille)
   - Sauvegarde dans localStorage (KEY_CATALOG13)
   ============================================================ */
const KEY_CATALOG13 = 'catalogueTypes_v2';

/*
Structure de base :

{
  "prises": [
    {"nom":"Prise 2P+T","tarifs":{"Création":90,"Remplacement appareillage":25,"Recâblage avec remplacement appareillage":45,"Recâblage sans remplacement appareillage":30}},
    ...
  ],
  "eclairage": {
    "luminaires":[
      {"nom":"Point de centre","tarifs":{"Création":110,"Remplacement luminaire":35,"Recâblage avec remplacement luminaire":55,"Recâblage sans remplacement luminaire":40}},
      ...
    ],
    "commandes":[
      {"nom":"Interrupteur simple","tarifs":{"Création":65,"Remplacement appareillage":25,"Recâblage avec remplacement appareillage":40,"Recâblage sans remplacement appareillage":28}},
      ...
    ]
  },
  "circuit_spec":[
    {"nom":"Four","tarifs":{"Création":140,"Remplacement appareillage":35,"Recâblage avec remplacement appareillage":55,"Recâblage sans remplacement appareillage":40}},
    ...
  ]
}

Les libellés d’intervention sont adaptés :
- Prises & Commandes : ...“appareillage”
- Luminaires : ...“luminaire”
- Circuit spécialisé : libellés “appareillage”
*/

function _catDefault(){
  return {
    prises: [
      { nom:"Prise 2P+T",        tarifs:{ "Création":90, "Remplacement appareillage":25, "Recâblage avec remplacement appareillage":45, "Recâblage sans remplacement appareillage":30 } },
      { nom:"Prise 2P+T IP44",   tarifs:{ "Création":110,"Remplacement appareillage":30, "Recâblage avec remplacement appareillage":50, "Recâblage sans remplacement appareillage":35 } }
    ],
    eclairage: {
      luminaires: [
        { nom:"Point de centre",  tarifs:{ "Création":110,"Remplacement luminaire":35, "Recâblage avec remplacement luminaire":55, "Recâblage sans remplacement luminaire":40 } },
        { nom:"Applique",         tarifs:{ "Création":95, "Remplacement luminaire":30, "Recâblage avec remplacement luminaire":50, "Recâblage sans remplacement luminaire":35 } }
      ],
      commandes: [
        { nom:"Interrupteur simple", tarifs:{ "Création":65,"Remplacement appareillage":25,"Recâblage avec remplacement appareillage":40,"Recâblage sans remplacement appareillage":28 } },
        { nom:"Interrupteur double", tarifs:{ "Création":80,"Remplacement appareillage":30,"Recâblage avec remplacement appareillage":48,"Recâblage sans remplacement appareillage":34 } }
      ]
    },
    circuit_spec: [
      { nom:"Four",                tarifs:{ "Création":140,"Remplacement appareillage":35,"Recâblage avec remplacement appareillage":55,"Recâblage sans remplacement appareillage":40 } },
      { nom:"Plaque de cuisson",   tarifs:{ "Création":155,"Remplacement appareillage":35,"Recâblage avec remplacement appareillage":60,"Recâblage sans remplacement appareillage":42 } },
      { nom:"Lave-linge",          tarifs:{ "Création":135,"Remplacement appareillage":30,"Recâblage avec remplacement appareillage":52,"Recâblage sans remplacement appareillage":38 } }
    ]
  };
}

function getCatalog13(){
  try{ return JSON.parse(localStorage.getItem(KEY_CATALOG13)||'null') || _catDefault(); }
  catch(e){ return _catDefault(); }
}
function setCatalog13(obj){
  try{ localStorage.setItem(KEY_CATALOG13, JSON.stringify(obj||_catDefault())); }catch(e){}

/* ============================================================
   13.2 • Helpers (merge, IO, UI utils)
   ============================================================ */
function _clone(x){ return JSON.parse(JSON.stringify(x)); }
function _ensureNum(n){ return Math.max(0, +n || 0); }
function _escape(s){ return String(s||'').replace(/[&<>"]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

// Deep merge “add-only + override on leaf numbers”
function _mergeTarifs(base, add){
  if(!add || typeof add!=='object') return;
  Object.keys(add).forEach(k=>{
    const v = add[k];
    if(v && typeof v==='object' && !Array.isArray(v)){
      if(!base[k] || typeof base[k]!=='object') base[k] = {};
      _mergeTarifs(base[k], v);
    }else{
      base[k] = v; // leaf (number/string) → override
    }
  });
}

/* ============================================================
   13.3 • Application au runtime (DESIGNATIONS + TARIFS_BASE)
   ------------------------------------------------------------
   - Alimente DESIGNATIONS_PAR_CATEGORIE :
       * "Prises" → tous types de prises
       * "Éclairage/Luminaires" → types luminaires
       * "Éclairage/Commandes" → types commandes
       * "Circuit spécialisé" → types circuit_spec
   - Fusionne dans TARIFS_BASE (ajout/override pour ces désignations)
   ============================================================ */
function applyCatalogToApp(){
  const cat = getCatalog13();

  // 1) DESIGNATIONS_PAR_CATEGORIE (si défini par l’app)
  if(typeof window.DESIGNATIONS_PAR_CATEGORIE === 'object'){
    // Prises
    window.DESIGNATIONS_PAR_CATEGORIE['Prises'] = window.DESIGNATIONS_PAR_CATEGORIE['Prises'] || [];
    cat.prises.forEach(t=>{
      if(window.DESIGNATIONS_PAR_CATEGORIE['Prises'].indexOf(t.nom)===-1){
        window.DESIGNATIONS_PAR_CATEGORIE['Prises'].push(t.nom);
      }
    });

    // Éclairage
    window.DESIGNATIONS_PAR_CATEGORIE['Éclairage/Luminaires'] = window.DESIGNATIONS_PAR_CATEGORIE['Éclairage/Luminaires'] || [];
    cat.eclairage.luminaires.forEach(t=>{
      if(window.DESIGNATIONS_PAR_CATEGORIE['Éclairage/Luminaires'].indexOf(t.nom)===-1){
        window.DESIGNATIONS_PAR_CATEGORIE['Éclairage/Luminaires'].push(t.nom);
      }
    });
    window.DESIGNATIONS_PAR_CATEGORIE['Éclairage/Commandes'] = window.DESIGNATIONS_PAR_CATEGORIE['Éclairage/Commandes'] || [];
    cat.eclairage.commandes.forEach(t=>{
      if(window.DESIGNATIONS_PAR_CATEGORIE['Éclairage/Commandes'].indexOf(t.nom)===-1){
        window.DESIGNATIONS_PAR_CATEGORIE['Éclairage/Commandes'].push(t.nom);
      }
    });

    // Circuit spécialisé
    window.DESIGNATIONS_PAR_CATEGORIE['Circuit spécialisé'] = window.DESIGNATIONS_PAR_CATEGORIE['Circuit spécialisé'] || [];
    cat.circuit_spec.forEach(t=>{
      if(window.DESIGNATIONS_PAR_CATEGORIE['Circuit spécialisé'].indexOf(t.nom)===-1){
        window.DESIGNATIONS_PAR_CATEGORIE['Circuit spécialisé'].push(t.nom);
      }
    });
  }

  // 2) TARIFS_BASE (si défini par l’app)
  //    On injecte/override les désignations avec les tarifs saisis ici.
  if(typeof window.TARIFS_BASE === 'object'){
    // Prises
    TARIFS_BASE.prises = TARIFS_BASE.prises || {};
    cat.prises.forEach(t=>{
      TARIFS_BASE.prises[t.nom] = TARIFS_BASE.prises[t.nom] || {};
      _mergeTarifs(TARIFS_BASE.prises[t.nom], t.tarifs || {});
    });

    // Éclairage / Luminaires (libellés “luminaire”)
    TARIFS_BASE.eclairage = TARIFS_BASE.eclairage || {};
    cat.eclairage.luminaires.forEach(t=>{
      TARIFS_BASE.eclairage[t.nom] = TARIFS_BASE.eclairage[t.nom] || {};
      _mergeTarifs(TARIFS_BASE.eclairage[t.nom], t.tarifs || {});
    });

    // Éclairage / Commandes (libellés “appareillage”)
    cat.eclairage.commandes.forEach(t=>{
      TARIFS_BASE.eclairage[t.nom] = TARIFS_BASE.eclairage[t.nom] || {};
      _mergeTarifs(TARIFS_BASE.eclairage[t.nom], t.tarifs || {});
    });

    // Circuit spécialisé : on injecte des désignations spécifiques (si un flux les utilise)
    // Sinon, ces tarifs serviront dans les écrans one-shot/rapides.
    TARIFS_BASE.circuit_specialise = TARIFS_BASE.circuit_specialise || {};
    cat.circuit_spec.forEach(t=>{
      TARIFS_BASE.circuit_specialise[t.nom] = TARIFS_BASE.circuit_specialise[t.nom] || {};
      _mergeTarifs(TARIFS_BASE.circuit_specialise[t.nom], t.tarifs || {});
    });
  }
}
// Applique au chargement du chapitre
applyCatalogToApp();

function _prixRowInputs(prefix, tarifs, keys){ 
  return keys.map(k=>{
    const id = `${prefix}-${k.replace(/\s+/g,'_')}`;
    const val = +(tarifs?.[k]||0);
    return `<div class="cat-field"><label>${_escape(k)}</label><input id="${id}" type="number" step="1" inputmode="decimal" value="${val}"/></div>`;
  }).join('');
}
function _saveTarifsFromInputs(prefix, keys){
  const out = {};
  keys.forEach(k=>{
    const id = `${prefix}-${k.replace(/\s+/g,'_')}`;
    const el = document.getElementById(id);
    out[k] = _ensureNum(el && el.value);
  });
  return out;
}

/* ============================================================
   13.9 • Import / Export / Reset
   ============================================================ */
function cat13Export(){
  const raw = JSON.stringify(getCatalog13(), null, 2);
  const blob = new Blob([raw], {type:'application/json;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'catalogue_types_v2.json'; a.click();
  URL.revokeObjectURL(url);
}
function cat13Import(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'application/json';
  input.onchange = function(){
    const f = input.files && input.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = function(){
      try{
        const obj = JSON.parse(rd.result||'{}');
        if(!obj || !obj.prises || !obj.eclairage || !obj.circuit_spec) { alert('❌ JSON inattendu.'); return; }
        setCatalog13(obj);
        applyCatalogToApp();
        alert('✅ Catalogue importé.');
        pageCatalogue();
      }catch(e){ alert('❌ Import impossible : '+e.message); }
    };
    rd.readAsText(f,'utf-8');
  };
  input.click();
}
function cat13Reset(){
  if(!confirm('Réinitialiser le catalogue aux valeurs par défaut ?')) return;
  localStorage.removeItem(KEY_CATALOG13);
  applyCatalogToApp();
  alert('✅ Catalogue réinitialisé.');
  pageCatalogue();
}

    window.pageTarifsAccueil = function(){
      orig();

      if(app.innerHTML.indexOf('pageCatalogue()')===-1){
        app.innerHTML = app.innerHTML.replace(
          /(<div class="row"[^>]*>[\s\S]*?<\/div>\s*<\/div>\s*<\/div>)/,
          '$1'
          + '<div class="card tarif-card"><div class="row" style="gap:8px;">'
          +   '<button class="btn" onclick="pageCatalogue()">'+btn+'</button>'
          + '</div></div>'
        );
      }
    };
  }
})();
